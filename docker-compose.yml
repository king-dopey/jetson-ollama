services:
  ollama:
    image: ollama/ollama:0.30.10
    container_name: ollama
    restart: unless-stopped
    runtime: nvidia
    env_file:
      - ./profiles/${PROFILE:-orin}/stack.env
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "0.0.0.0:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - /storage/ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ollama-warmup:
    image: curlimages/curl:8.14.1
    container_name: ollama-warmup
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - ./profiles/${PROFILE:-orin}/stack.env
    environment:
      OLLAMA_URL: http://ollama:11434
      KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      PULL_MAX_RETRIES: ${PULL_MAX_RETRIES:-3}
      PULL_BACKOFF_SEC: ${PULL_BACKOFF_SEC:-10}
      ACTIVE_PROFILE: ${PROFILE:-orin}
    volumes:
      - ./scripts:/scripts:ro
      - ./profiles/${PROFILE:-orin}/models.yaml:/profiles/models.yaml:ro
      - ./profiles/${PROFILE:-orin}/librechat-modelspecs.yaml:/profiles/librechat-modelspecs.yaml:ro
    command: ["/bin/sh", "/scripts/warmup.sh"]

  ollama-pull-verifier:
    profiles: ["verifier"]
    image: ollama/ollama:0.30.10
    container_name: ollama-pull-verifier
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - ./profiles/${PROFILE:-orin}/stack.env
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$MODEL_VERIFY_TAG\""]

  asr:
    profiles: ["asr"]
    build:
      context: ./asr
      dockerfile: Dockerfile
      args:
        ASR_TORCH_INDEX_URL: ${ASR_TORCH_INDEX_URL:-https://pypi.jetson-ai-lab.io/jp6/cu126}
        ASR_TORCH_VERSION: ${ASR_TORCH_VERSION:-2.8.0}
        ASR_TORCHAUDIO_VERSION: ${ASR_TORCHAUDIO_VERSION:-2.8.0}
    container_name: asr-service
    restart: unless-stopped
    runtime: nvidia
    environment:
      ASR_ENABLED: ${ASR_ENABLED:-1}
      ASR_PORT: ${ASR_PORT:-8000}
      ASR_MODEL: ${ASR_MODEL:-whisper-large-v3-turbo}
      ASR_MODEL_ACCURACY: ${ASR_MODEL_ACCURACY:-whisper-large-v3}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-float16}
      ASR_DEVICE: ${ASR_DEVICE:-auto}
      ASR_EXPECT_DEVICE: ${ASR_EXPECT_DEVICE:-cuda}
      ASR_ALLOW_DEGRADED_BACKEND: ${ASR_ALLOW_DEGRADED_BACKEND:-0}
      ASR_ALLOW_COMPUTE_FALLBACK: ${ASR_ALLOW_COMPUTE_FALLBACK:-0}
      ASR_FORCE_ALIGNMENT: ${ASR_FORCE_ALIGNMENT:-1}
      ASR_KEEP_WARM: ${ASR_KEEP_WARM:-0}
      ASR_MODEL_CACHE: ${ASR_MODEL_CACHE:-/app/models}
      HF_HOME: ${HF_HOME:-/app/models/hf}
      HUGGINGFACE_HUB_CACHE: ${HUGGINGFACE_HUB_CACHE:-/app/models/hf/hub}
      TRANSFORMERS_CACHE: ${TRANSFORMERS_CACHE:-/app/models/hf/transformers}
      XDG_CACHE_HOME: ${XDG_CACHE_HOME:-/app/models/xdg}
      ASR_LOG_LEVEL: ${ASR_LOG_LEVEL:-info}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "${ASR_PORT:-8000}:${ASR_PORT:-8000}"
    volumes:
      - asr-model-cache:/app/models:rw
      - /tmp:/tmp:rw
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${ASR_PORT:-8000}/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  asr-model-cache:
