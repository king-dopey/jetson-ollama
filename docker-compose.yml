services:
  ollama:
    image: ${OLLAMA_IMAGE_TAG:-ollama/ollama:latest}
    container_name: ollama
    restart: unless-stopped
    runtime: nvidia
    env_file:
      - profiles/ollama.env
      - profiles/jetson/${HARDWARE:-orin}.env
    ports:
      - "${OLLAMA_HOST}:11434"
    volumes:
      - ${OLLAMA_VOLUME_HOST}:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ollama-warmup:
    image: curlimages/curl:latest
    container_name: ollama-warmup
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - profiles/warmup.env
      - profiles/jetson/${HARDWARE:-orin}.env
    volumes:
      - ./scripts:/scripts:ro
    command: ["/bin/sh", "/scripts/warmup.sh"]

  ollama-pull-verifier:
    profiles: ["verifier"]
    image: ${OLLAMA_IMAGE_TAG:-ollama/ollama:latest}
    container_name: ollama-pull-verifier
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama", "pull", "${VERIFIER_PULL_MODEL:-qwen3-coder:30b}"]