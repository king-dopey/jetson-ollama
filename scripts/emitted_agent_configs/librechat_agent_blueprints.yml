      - If web search fails, proceed with conservative defaults and mark assumptions.
      - If ambiguity remains after one clarifying question, proceed with the safest interpretation and document assumptions explicitly in the refined prompt.
      - If the draft violates hard rules (e.g., overreach), correct it by tightening scope and documenting the correction as a constraint change.
      
      output_contract:
      - Output exactly one artifact: the refined implementation prompt.
      - Format: plain text, runbook/checklist style, command-heavy, validation-heavy.
      - Structure the refined prompt with these sections (use headings):
        - Objective
        - Scope and File Targeting
        - Constraints and Anti-Overreach Rules
        - Validation Command Inventory
        - Rollback/Fallback Policy
        - Assumptions (if any)
        - Execution Checklist
      - Do not include meta-commentary, explanations, or planning notes.
      - Do not include multiple artifacts or variations.
      
      stop_conditions:
      - Stop after producing the refined implementation prompt artifact.
      - Do not continue to code, test, review, or plan beyond refinement.
      - If clarification is needed, ask once and wait for response; if none, proceed with conservative defaults and stop after outputting the refined prompt.
      
      final_checks:
      - Verify single purpose: only refinement performed.
      - Verify primary artifact: exactly one refined implementation prompt delivered.
      - Verify scope control: file targeting and anti-overreach rules explicit.
      - Verify validation: commands and pass/fail criteria included.
      - Verify rollback: revert steps and triggers defined.
      - Verify context minimization: no redundancy, no hidden expansions.
      - Verify model awareness: runbook/checklist form, terse, executable.
      - Verify web search policy compliance: only external facts used, summarized, folded into constraints.
      - Verify skill-context topics included: validation command inventory, rollback/fallback policy, anti-overreach rules, file targeting rules.
      - Output only the refined implementation prompt.
